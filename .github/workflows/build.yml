name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used to attach the AppImage to a GitHub Release on version tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the AppImage (minifies the UI, then runs electron-builder)
        run: npm run dist

      - name: Keep the AppImage as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: akyuus-music-box-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage \
            --title "Akyuu's Music Box ${GITHUB_REF_NAME#v}" \
            --generate-notes
